<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuro Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Smooth animation */
        .fade-in {
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from {opacity:0; transform: translateY(10px);}
            to {opacity:1; transform: translateY(0);}
        }

        /* Loader */
        .loader {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 1);
        }
    </style>
</head>

<body class="text-slate-800 min-h-screen font-sans">

<div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
    <div class="glass-card p-10 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] w-full max-w-md fade-in text-center">
        
        <div class="inline-block p-4 rounded-2xl bg-indigo-50 mb-6">
            <span class="text-3xl">🛡️</span>
        </div>

        <h1 class="text-3xl font-black mb-2 text-slate-900 tracking-tight">
            Nuro Admin
        </h1>
        <p class="text-slate-500 mb-8 text-sm font-medium">Silakan masuk ke pusat kendali</p>

        <input type="password" id="password"
            placeholder="Masukkan Password..."
            class="w-full p-4 bg-slate-100 border-none rounded-2xl mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-center font-bold">

        <button onclick="attemptLogin()"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white transition-all py-4 rounded-2xl font-bold shadow-lg shadow-indigo-200 active:scale-95">
            Masuk Sekarang
        </button>

        <p id="login-msg" class="text-red-500 text-sm mt-4 font-bold hidden"></p>
    </div>
</div>

<div id="dashboard-screen" class="hidden p-6 md:p-10 max-w-7xl mx-auto fade-in">

    <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
        <div>
            <h1 class="text-4xl font-black text-slate-900 tracking-tighter">
                Nuro <span class="text-indigo-600">Control Center</span>
            </h1>
            <p class="text-slate-500 font-medium">Pantau dan kelola konten berita Anda</p>
        </div>

        <button onclick="logout()"
            class="bg-white text-red-500 border border-red-100 hover:bg-red-50 px-6 py-3 rounded-2xl text-sm font-bold shadow-sm transition-all">
            Keluar Sistem
        </button>
    </div>

    <div class="flex flex-wrap items-center justify-between mb-8 gap-4">
        <div class="flex gap-3 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-100">
            <button onclick="filterTerbaru()"
                class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all hover:bg-slate-50" id="btn-terbaru">
                🕒 Terbaru
            </button>
            <button onclick="filterTrending()"
                class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md shadow-indigo-100" id="btn-trending">
                🔥 Trending
            </button>
        </div>
        
        <div class="text-slate-400 text-sm font-bold uppercase tracking-widest" id="title-dashboard">
            Semua Berita
        </div>
    </div>

    <div id="admin-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
</div>

<div id="ai-modal"
    class="fixed inset-0 bg-slate-900/40 backdrop-blur-md hidden items-center justify-center z-50 p-4">

    <div class="bg-white rounded-3xl w-full max-w-xl p-8 shadow-[0_30px_60px_rgba(0,0,0,0.1)] border border-white fade-in">

        <div class="flex items-center gap-3 mb-6">
            <div class="bg-indigo-100 p-2 rounded-lg text-indigo-600 text-xl">✨</div>
            <h2 class="text-2xl font-black text-slate-900">
                AI Caption Tool
            </h2>
        </div>

        <div id="ai-content"
            class="bg-slate-50 border border-slate-100 p-6 rounded-2xl min-h-[150px] text-slate-700 leading-relaxed font-medium">
        </div>

        <div class="flex justify-end mt-8 gap-3">
            <button onclick="copyCaption()" id="btn-copy" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-2xl font-bold transition-all">
                Salin Teks
            </button>
            <button onclick="closeModal()"
                class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-6 py-3 rounded-2xl font-bold transition-all">
                Tutup
            </button>
        </div>
    </div>
</div>

<script>
let allNews = [];

if (localStorage.getItem('nuro_token')) {
    showDashboard();
}

async function attemptLogin() {
    const pass = document.getElementById('password').value;
    const msgBox = document.getElementById('login-msg');

    msgBox.classList.remove('hidden');
    msgBox.innerHTML = "Memverifikasi...";

    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ password: pass })
        });

        const data = await res.json();

        if (data.success) {
            localStorage.setItem('nuro_token', data.token);
            showDashboard();
        } else {
            msgBox.innerHTML = data.message;
        }

    } catch {
        msgBox.innerHTML = "Server error.";
    }
}

function logout() {
    localStorage.removeItem('nuro_token');
    location.reload();
}

function showDashboard() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('dashboard-screen').classList.remove('hidden');
    loadNewsData();
}

async function loadNewsData() {
    const res = await fetch('/api/news');
    allNews = await res.json();
    renderNews(allNews);
}

function filterTrending() {
    const trending = [...allNews].sort((a,b)=>(b.views||0)-(a.views||0));
    renderNews(trending);
    document.getElementById('title-dashboard').innerText = "🔥 Trending";
}

function filterTerbaru() {
    renderNews(allNews);
    document.getElementById('title-dashboard').innerText = "Semua Berita";
}

function renderNews(data) {
    document.getElementById('admin-list').innerHTML = data.map(n => `
        <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 relative overflow-hidden group">
            
            <div class="flex justify-between items-start mb-4">
                <span class="bg-indigo-50 text-indigo-600 text-[10px] font-black uppercase tracking-tighter px-3 py-1 rounded-full">
                    Article ID: ${n.id}
                </span>
                <div class="flex items-center gap-1.5 font-black text-indigo-600 bg-white shadow-sm border border-slate-50 px-3 py-1 rounded-full text-xs">
                    👁️ ${n.views || 0}
                </div>
            </div>

            <h3 class="text-xl font-bold mb-3 text-slate-900 leading-tight">
                ${n.title}
                ${(n.views||0)>10 ? '<span class="ml-1 text-red-500">🔥</span>' : ''}
            </h3>

            <p class="text-sm text-slate-500 mb-6 line-clamp-3 font-medium">
                ${n.description || 'Tidak ada deskripsi'}
            </p>

            <div class="flex gap-3 pt-4 border-t border-slate-50">
                <a href="${n.url}" target="_blank"
                    class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 text-center py-3 rounded-xl text-sm font-bold transition-all">
                    Buka
                </a>

                <button onclick="openModal('${n.title.replace(/'/g,"\\'")}','${(n.description||'').replace(/'/g,"\\'")}')"
                    class="flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-sm font-bold shadow-lg shadow-indigo-100 transition-all">
                    Buat Caption AI
                </button>
            </div>
        </div>
    `).join('');
}

async function openModal(title, desc) {
    const modal = document.getElementById('ai-modal');
    const content = document.getElementById('ai-content');
    const btnCopy = document.getElementById('btn-copy');

    modal.classList.remove('hidden');
    modal.classList.add('flex');
    btnCopy.classList.add('hidden');

    content.innerHTML = `
        <div class="flex flex-col items-center justify-center py-6 gap-3">
            <div class="loader"></div> 
            <span class="text-indigo-600 font-bold animate-pulse">AI NURO sedang menulis...</span>
        </div>`;

    try {
        const res = await fetch('/api/ai-caption',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({title, desc})
        });

        const data = await res.json();

        if(data.success) {
            content.innerHTML = data.text;
            btnCopy.classList.remove('hidden');
        } else {
            content.innerHTML = "Gagal memproses AI.";
        }

    } catch {
        content.innerHTML = "Koneksi server terputus.";
    }
}

function copyCaption() {
    const text = document.getElementById('ai-content').innerText;
    navigator.clipboard.writeText(text);
    const btn = document.getElementById('btn-copy');
    btn.innerHTML = "✅ Berhasil Disalin!";
    setTimeout(() => { btn.innerHTML = "Salin Teks"; }, 2000);
}

function closeModal() {
    const modal = document.getElementById('ai-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
}

</script>

</body>
</html>
