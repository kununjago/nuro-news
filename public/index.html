<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuro News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body.modal-open { overflow: hidden; }
        /* Animasi Drawer untuk HP */
        #calendar-drawer { transition: transform 0.3s ease-in-out; }
        .drawer-hide { transform: translateX(100%); }
        .drawer-show { transform: translateX(0); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-gray-800">
    
    <nav class="bg-indigo-700 p-4 text-white sticky top-0 z-40 shadow-md">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="font-black text-2xl tracking-tight cursor-pointer" onclick="loadNews('terbaru')">
                NURO <span class="text-yellow-400">NEWS</span>
            </h1>

            <div id="market-bar" class="flex gap-4 text-[10px] md:text-xs font-mono bg-indigo-800 px-4 py-2 rounded-lg border border-indigo-600">
                <span class="text-gray-300">LOADING MARKET...</span>
            </div>

            <a href="https://saweria.co/nurodukungan" target="_blank" class="bg-yellow-400 text-black px-4 py-2 rounded-full font-bold text-xs shadow-sm">Support Kami</a>
        </div>
    </nav>

    <button onclick="toggleDrawer(true)" class="md:hidden fixed bottom-6 right-6 z-50 bg-indigo-600 text-white p-4 rounded-full shadow-2xl flex items-center gap-2 font-bold active:scale-95 transition-transform">
        <span>📅</span> Liat Ekonomi
    </button>

    <main class="max-w-7xl mx-auto p-4 md:p-8 mt-4 grid grid-cols-1 md:grid-cols-12 gap-8">
        
        <div class="md:col-span-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800" id="section-title">Berita</h2>
                </div>
                <div class="flex w-full md:w-auto shadow-sm">
                    <input type="text" id="searchInput" placeholder="Cari berita..." class="px-4 py-2 border border-gray-300 rounded-l-lg focus:outline-none w-full md:w-64">
                    <button onclick="searchNews()" class="bg-indigo-600 text-white px-5 py-2 rounded-r-lg font-bold">Cari</button>
                </div>
            </div>

            <div class="flex gap-2 mb-6 border-b pb-4">
                <button id="tab-terbaru" onclick="loadNews('terbaru')" class="px-4 py-2 bg-indigo-100 text-indigo-700 font-bold rounded-full text-sm">🕒 Terbaru</button>
                <button id="tab-trending" onclick="loadNews('trending')" class="px-4 py-2 text-gray-500 font-bold rounded-full text-sm">🔥 Trending</button>
            </div>

            <div id="news-list" class="grid gap-6"></div>
        </div>

        <div class="hidden md:block md:col-span-4">
            <div class="sticky top-28 bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                <h3 class="text-lg font-bold mb-4 border-b pb-2 flex items-center gap-2">📅 Kalender Ekonomi <span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded">LIVE</span></h3>
                <div class="h-[600px] overflow-hidden rounded-lg border border-gray-100">
                    <div id="economicCalendarWidget"></div>
                    <script async type="text/javascript" data-type="calendar-widget" src="https://www.tradays.com/c/js/widgets/calendar/widget.js?v=15">
                        {"width":"100%","height":"100%","mode":"2","fw":"html"}
                    </script>
                </div>
            </div>
        </div>
    </main>

    <div id="drawer-overlay" onclick="toggleDrawer(false)" class="md:hidden fixed inset-0 bg-black/60 z-[60] hidden backdrop-blur-sm"></div>
    
    <div id="calendar-drawer" class="md:hidden fixed top-0 right-0 h-full w-[85%] bg-white z-[70] shadow-2xl drawer-hide flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-indigo-50">
            <h3 class="font-bold text-indigo-800">Kalender Ekonomi</h3>
            <button onclick="toggleDrawer(false)" class="text-2xl font-black">&times;</button>
        </div>
        <div class="flex-grow overflow-auto p-2">
            <div id="economicCalendarWidgetMobile"></div>
            <script async type="text/javascript" data-type="calendar-widget" src="https://www.tradays.com/c/js/widgets/calendar/widget.js?v=15">
                {"width":"100%","height":"100%","mode":"2","fw":"html"}
            </script>
        </div>
    </div>

    <div id="article-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl relative overflow-hidden">
            <div class="p-4 border-b flex justify-between bg-white sticky top-0">
                <h2 class="text-xl font-bold pr-6" id="modal-title">Memuat...</h2>
                <button onclick="closeModal()" class="text-gray-400 text-3xl font-black">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto">
                <div id="modal-body" class="prose max-w-none text-gray-700 text-lg leading-relaxed mb-8"></div>
                <div class="bg-indigo-50 p-6 rounded-xl text-center">
                    <a href="#" id="modal-source-link" target="_blank" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold inline-block">Baca Situs Asli ↗</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allNews = [];

        // FUNGSI DRAWER HP
        function toggleDrawer(show) {
            const drawer = document.getElementById('calendar-drawer');
            const overlay = document.getElementById('drawer-overlay');
            if(show) {
                drawer.classList.replace('drawer-hide', 'drawer-show');
                overlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } else {
                drawer.classList.replace('drawer-show', 'drawer-hide');
                overlay.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        }

        async function updateMarketData() {
            try {
                const res = await fetch('/api/market');
                const d = await res.json();
                const fmt = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);
                document.getElementById('market-bar').innerHTML = `
                    <div class="flex gap-4">
                        <span>BTC: ${fmt(d.btc)}</span>
                        <span>SOL: ${fmt(d.sol)}</span>
                        <span>USD/IDR: ${d.usdidr.toFixed(0)}</span>
                    </div>`;
            } catch (e) {}
        }

        async function loadNews(type = 'terbaru', q = '') {
            const container = document.getElementById('news-list');
            container.innerHTML = '<p class="text-center py-20 text-gray-400 animate-pulse font-bold">📡 Sedang mencari berita terbaru...</p>';

            // UI Tabs
            document.getElementById('tab-terbaru').className = type === 'terbaru' ? "px-4 py-2 bg-indigo-100 text-indigo-700 font-bold rounded-full text-sm" : "px-4 py-2 text-gray-500 font-bold rounded-full text-sm";
            document.getElementById('tab-trending').className = type === 'trending' ? "px-4 py-2 bg-yellow-100 text-yellow-700 font-bold rounded-full text-sm" : "px-4 py-2 text-gray-500 font-bold rounded-full text-sm";

            try {
                let url = q ? `/api/news?q=${encodeURIComponent(q)}` : (type === 'trending' ? '/api/news?type=trending' : '/api/news');
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.length === 0) {
                    container.innerHTML = '<p class="text-center py-20">Berita tidak ditemukan.</p>';
                    return;
                }

                container.innerHTML = data.map(n => `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-all cursor-pointer group" onclick="openModal(${n.id})">
                        <div class="flex justify-between items-start mb-3">
                            <h2 class="text-xl font-bold group-hover:text-indigo-600 transition-colors">${n.title}</h2>
                            ${n.views > 5 ? '<span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full font-bold">🔥</span>' : ''}
                        </div>
                        <p class="text-gray-600 line-clamp-2 text-sm mb-4">${n.description || 'Klik untuk baca selengkapnya...'}</p>
                        <div class="flex justify-between items-center text-xs text-gray-400 font-bold uppercase tracking-widest">
                            <span class="text-indigo-500">Baca Artikel →</span>
                            <span>👁️ ${n.views || 0} VIEWS</span>
                        </div>
                    </div>`).join('');
            } catch (e) { container.innerHTML = '<p class="text-red-500">Error.</p>'; }
        }

        async function openModal(id) {
            const modal = document.getElementById('article-modal');
            modal.classList.replace('hidden', 'flex');
            document.body.classList.add('modal-open');
            document.getElementById('modal-title').innerText = "AI NURO sedang menulis...";
            document.getElementById('modal-body').innerHTML = '<div class="py-20 text-center animate-pulse">✨ AI NURO sedang merewrite berita untukmu...</div>';

            const res = await fetch(`/api/news/${id}`);
            const n = await res.json();
            document.getElementById('modal-title').innerText = n.title;
            document.getElementById('modal-body').innerHTML = `<p>${n.content.replace(/\n\n/g, '</p><p class="mb-4">').replace(/\n/g, '<br>')}</p>`;
            document.getElementById('modal-source-link').href = n.url;
        }

        function closeModal() {
            document.getElementById('article-modal').classList.replace('flex', 'hidden');
            document.body.classList.remove('modal-open');
            loadNews();
        }

        function searchNews() {
            const q = document.getElementById('searchInput').value;
            if(q) loadNews('search', q);
        }

        updateMarketData();
        loadNews();
        setInterval(updateMarketData, 300000);
    </script>
</body>
</html>
